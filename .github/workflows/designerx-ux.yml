name: DesignerX Native UX Inspect
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ux-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
      - name: Checkout DesignerX source
        uses: actions/checkout@v4
        with:
          repository: iwerry/designerx
          path: designerx
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate inline JavaScript syntax
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import vm from "node:vm";
            const html = fs.readFileSync("index.html", "utf8");
            const start = html.indexOf("<script>") + 8;
            const end = html.indexOf("</script>", start);
            if (start < 8 || end < start) throw Error("Inline script not found");
            const scripts = [[null, html.slice(start, end)]];
            if (!scripts.length) throw Error("No inline JavaScript found");
            for (const [, code] of scripts) new vm.Script(code);
            console.log("Inline JavaScript syntax OK");
          '
      - name: Test original DesignerX engine
        run: node --test designerx/native/*.test.mjs
      - name: Validate portfolio context
        run: node designerx/native/context.mjs .
      - name: Critique portfolio structure
        run: node designerx/native/critique.mjs index.html
      - name: Inspect motion
        run: node designerx/native/motion.mjs index.html
      - name: Generate independent UX handoff
        run: node designerx/native/handoff.mjs index.html --stdout > /tmp/DESIGNERX_HANDOFF.md
      - name: Inspect portfolio HTML
        run: node designerx/native/inspect.mjs index.html --json
