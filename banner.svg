<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="title desc">
<title id="title">Daniel Rodrigues — UX/UI Designer, Front-End Developer, Creative Technologist</title>
<desc id="desc">Animated portfolio identity banner with electric blue condensed title, editorial serif subtitle, kinetic lines and interactive grid.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07082b"/><stop offset=".65" stop-color="#0d0f3d"/><stop offset="1" stop-color="#07082b"/></linearGradient>
<linearGradient id="type" x1="0" x2="1"><stop stop-color="#6f74ff"/><stop offset=".5" stop-color="#a9b0ff"/><stop offset="1" stop-color="#6f74ff"/></linearGradient>
<linearGradient id="scan" x1="0" x2="1"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".48" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset=".52" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#818aff" stroke-width=".75" stroke-opacity=".17"/></pattern>
<clipPath id="letters"><text x="52" y="179" class="display">UX/UI DESIGNER</text></clipPath>
<style>
.display{font:900 122px 'Big Shoulders Display','Arial Narrow',Impact,sans-serif;letter-spacing:-1px}
.strong{font:900 41px 'Big Shoulders Display','Arial Narrow',Impact,sans-serif;letter-spacing:2px}
.serif{font:400 23px 'Newsreader',Georgia,serif;letter-spacing:.5px}
.eyebrow{font:700 14px 'Big Shoulders Display','Arial Narrow',Impact,sans-serif;letter-spacing:4px}
.gridmove{animation:drift 19s linear infinite}
.orbit{animation:orbit 8s ease-in-out infinite}
.sweep{animation:sweep 7s ease-in-out infinite}
.line{animation:reveal 1.7s cubic-bezier(.2,.7,.2,1) both;transform-origin:0 0}
.fade{animation:fade 1.2s ease-out both}
@keyframes drift{to{transform:translate(34px,17px)}}
@keyframes orbit{50%{transform:translate(-23px,-15px)}}
@keyframes sweep{0%,12%{transform:translateX(-680px)}55%,100%{transform:translateX(1380px)}}
@keyframes reveal{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.gridmove,.orbit,.sweep,.line,.fade{animation:none}}
</style>
</defs>
<rect width="1200" height="400" fill="url(#bg)"/>
<rect width="1200" height="400" fill="url(#grid)" class="gridmove"/>
<g class="orbit"><circle cx="1070" cy="100" r="66" fill="#5360ff" opacity=".075"/><circle cx="1070" cy="100" r="20" fill="#6f74ff" opacity=".38"/><circle cx="1070" cy="100" r="5" fill="#b0b4ff"/></g>
<path d="M946 77h194M989 93h151M1020 109h120" stroke="#6f74ff" opacity=".55" stroke-width="2"/>
<path d="M0 355H1200" stroke="#6f74ff" opacity=".48" stroke-width="1"/>
<rect x="0" y="393" width="1200" height="7" fill="#1d21ff"/>
<text x="52" y="70" class="eyebrow fade" fill="#a3a7dd">DESIGN  /  CODE  /  MOTION  /  AI</text>
<text x="52" y="179" class="display fade" fill="url(#type)">UX/UI DESIGNER</text>
<g clip-path="url(#letters)"><rect class="sweep" x="-700" y="75" width="700" height="135" fill="url(#scan)" opacity=".55"/></g>
<rect x="55" y="197" width="760" height="4" rx="2" fill="#6f74ff" class="line"/>
<text x="52" y="253" class="strong fade" fill="#eceeff">DANIEL RODRIGUES</text>
<text x="52" y="294" class="serif fade" fill="#ced3ef">Front-End Developer · Creative Technology</text>
<text x="52" y="337" class="serif" font-style="italic" fill="#9fa6d8">Interfaces and creative systems with purpose.</text>
<g opacity=".7"><path d="M1010 263l32-32 32 32-32 32z" fill="none" stroke="#7280ff" stroke-width="3"/><path d="M1060 263l32-32 32 32-32 32z" fill="none" stroke="#7280ff" stroke-width="2"/><circle cx="1137" cy="317" r="7" fill="#8790ff"/></g>
</svg>