<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Daniel Rodrigues — UX/UI Designer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6f74ff" stroke-opacity=".28" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="4s" repeatCount="indefinite"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#07082b" stop-opacity="0"/>
      <stop offset="1" stop-color="#07082b" stop-opacity=".9"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".3" r=".6">
      <stop offset="0" stop-color="#1d21ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1d21ff" stop-opacity="0"/>
      <animate attributeName="cx" values=".3;.75;.3" dur="9s" repeatCount="indefinite"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="#07082b"/>
  <rect width="1200" height="400" fill="url(#g)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>
  <rect width="1200" height="400" fill="url(#fade)"/>
  <g font-family="'Arial Narrow','Impact','Arial Black',sans-serif" font-weight="900">
    <text x="70" y="170" font-size="118" fill="#6f74ff" letter-spacing="-2">UX/UI DESIGNER
      <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
    </text>
    <text x="72" y="235" font-size="40" fill="#eceeff" letter-spacing="3">DANIEL RODRIGUES
      <animate attributeName="opacity" from="0" to="1" begin=".4s" dur="1s" fill="freeze"/>
    </text>
    <text x="72" y="285" font-size="24" fill="#a3a7dd" font-weight="700" letter-spacing="2" font-family="Georgia,serif">FRONT-END DEVELOPER  ·  CREATIVE TECHNOLOGY
      <animate attributeName="opacity" from="0" to="1" begin=".8s" dur="1s" fill="freeze"/>
    </text>
  </g>
  <circle cx="1090" cy="330" r="7" fill="#6f74ff">
    <animate attributeName="r" values="7;16;7" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <rect x="0" y="396" width="1200" height="4" fill="#1d21ff">
    <animate attributeName="width" values="0;1200;0" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
